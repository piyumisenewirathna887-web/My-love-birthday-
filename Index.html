<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4da6;
            --bg-color: #fff0f3;
            --text-color: #2b2d42;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            max-width: 800px;
            width: 90%;
            padding: 2rem;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin: 2rem 0;
            animation: fadeIn 1.5s ease-in-out;
            position: relative;
            z-index: 10;
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--primary-color);
            margin: 0 0 1rem 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .english-text {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 1.5rem 0;
        }
        .cake-container {
            margin: 2rem 0;
            cursor: pointer;
        }
        #cake {
            font-size: 5rem;
            transition: transform 0.3s;
        }
        .carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 1rem;
            padding: 1rem 0;
            width: 100%;
            border-top: 2px dashed var(--primary-color);
            border-bottom: 2px dashed var(--primary-color);
        }
        .memory-card {
            flex: 0 0 80%;
            scroll-snap-align: center;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            padding: 1rem;
        }
        .memory-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }
        .floating-heart {
            position: absolute;
            color: var(--primary-color);
            font-size: 1.5rem;
            animation: floatUp 4s linear infinite;
            top: 100vh;
        }
        @keyframes floatUp {
            to { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Birthday to my handsome boy</h1>
        <div class="english-text">
            Meeting you was the best thing that ever happened to me. You're my whole world—my brother, my best friend, and my loving boyfriend.
        </div>
        <div class="english-text">
            I love you so much, and I hope all your dreams and wishes come true.
        </div>

        <div class="cake-container" onclick="sliceCake()">
            <div id="cake">🎂</div>
            <p>Tap to slice the cake!</p>
        </div>

        <div class="carousel">
            <div class="memory-card"><img src="IMG-20260215-WA0291.jpg" alt="Memory 1"></div>
            <div class="memory-card"><img src="IMG-20260317-WA0010.jpg" alt="Memory 2"></div>
            <div class="memory-card"><img src="IMG-20260317-WA0023.jpg" alt="Memory 3"></div>
            <div class="memory-card"><img src="IMG-20260414-WA0085.jpg" alt="Memory 4"></div>
        </div>
    </div>

    <script>
        function sliceCake() {
            const cake = document.getElementById('cake');
            cake.innerHTML = '🍰';
            alert('Enjoy your slice of love!');
        }

        function createHearts() {
            for(let i=0; i<10; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.className = 'floating-heart';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }
        }
        setInterval(createHearts, 2000);
    </script>
</body>
</html>
